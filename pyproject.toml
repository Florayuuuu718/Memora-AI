[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memora-ai"
version = "0.1.0"
description = "Independent AI vision service for photo understanding and retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "numpy>=1.24",
  "Pillow>=10.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
openclip = [
  "torch>=2.1",
  "open-clip-torch>=2.24",
]
vision = [
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "ImageHash>=4.3",
]
models = [
  "torch>=2.1",
  "open-clip-torch>=2.24",
  "insightface>=0.7",
  "onnxruntime>=1.16",
]
qdrant = ["qdrant-client>=1.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
memora = "memora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
